name: Release

# The signed APK is built here rather than on a laptop: the keystore and its
# passwords live only in repository secrets, so they never touch the working
# tree, the build output or the release notes.
#
# One-time setup — Settings › Secrets and variables › Actions:
#   KEYSTORE_BASE64     base64 of the release keystore
#   KEYSTORE_PASSWORD   password of the keystore
#   KEY_ALIAS           alias of the key inside it
#   KEY_PASSWORD        password of that key
#
# Then bump versionCode and versionName in app/build.gradle.kts, tag the commit
# `vX.Y.Z` and push the tag — the release appears with the APK attached.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check the signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=''
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see the comment at the top of this workflow."
            exit 1
          fi

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Confirm the APK came out signed
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          if [ -z "$apk" ]; then
            echo '::error::Only an unsigned APK was produced — the signing config did not apply.'
            exit 1
          fi
          version=$(basename "${GITHUB_REF_NAME#v}")
          [ "$GITHUB_REF_TYPE" = 'tag' ] || version='snapshot'
          cp "$apk" "noscroll-guard-$version.apk"
          echo "APK=noscroll-guard-$version.apk" >> "$GITHUB_ENV"

      - name: Attach it to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Or keep it as a build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: noscroll-guard-apk
          path: ${{ env.APK }}
